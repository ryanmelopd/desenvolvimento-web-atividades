<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 98vh;
        }
        .container {
        width: 300px;
        display: grid;
        grid-template-columns: 1fr 1fr 1fr; /* fr é um bloco */
        background-color: grey;
        padding: 10px;
        gap: 16px;
        }
        .container div {
        background-color: white;
        border: 1px solid rgb(1, 0, 0);
        padding: 10px;
        font-size: 30px;
        text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
  <div>1</div>
  <div>2</div>
  <div>3</div>
  <div>4</div>
  <div>5</div>
  <div>6</div>
  <div>7</div>
  <div>8</div>
  <div>9</div>
</div>
</body>
</html>
